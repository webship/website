################
# GitLab CI for the Website project template (a Composer "project" package).
#
# The drupal.org module and recipe jobs do not apply to a project template, so
# only the templates' variables (images, database) and workflow (merge request
# pipelines) are included. The jobs validate composer.json, then build the
# project from this branch and install Drupal with its installer profile.
# Documentation: https://project.pages.drupalcode.org/gitlab_templates/
################
include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

variables:
  _TARGET_PHP: '8.4'
  DRUPAL_CORE: '11.4.x-dev'
  COMPOSER_NO_INTERACTION: '1'

default:
  image: $_CONFIG_DOCKERHUB_ROOT/php-$_TARGET_PHP-$_TARGET_PHP_IMAGE_VARIANT:$_TARGET_PHP_IMAGE_TAG
  interruptible: true

stages:
  - validate
  - test

composer validate:
  stage: validate
  script:
    - composer --version
    - composer validate --strict

# Build the project from this branch, on Drupal 11.4, and install Drupal.
project:
  stage: test
  needs: []
  services:
    - name: $_CONFIG_DOCKERHUB_ROOT/$_TARGET_DB_TYPE-$_TARGET_DB_VERSION:$_TARGET_DB_IMAGE_TAG
      alias: database
  variables:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: mysql
    MYSQL_USER: drupaltestbot
    MYSQL_PASSWORD: drupaltestbotpw
  script:
    - composer require --no-update "drupal/core-recommended:$DRUPAL_CORE"
    - composer config repositories.drupal '{"type":"composer","url":"https://packages.drupal.org/8","exclude":["drupal/webreleases","drupal/webship"]}'
    # @todo Remove when packages.drupal.org lists drupal/webship 12.0.x-dev. A
    #   vcs repository names every branch webship/webship, after the name in
    #   the composer.json of the default branch, 11.0.x.
    - composer config repositories.webship '{"type":"package","package":{"name":"drupal/webship","version":"12.0.x-dev","type":"drupal-profile","source":{"type":"git","url":"https://git.drupalcode.org/project/webship.git","reference":"12.0.x"},"require":{"composer/composer":"^2.8","drupal/core":"^11.4 || ^12"}}}'
    # @todo Remove when webreleases 12.0.x has the Display Builder displays:
    #   https://git.drupalcode.org/project/webreleases/-/merge_requests/5
    - composer config repositories.webreleases vcs https://git.drupalcode.org/issue/webreleases-3591672.git
    - composer require --no-update "drupal/webreleases:dev-3591672-display-builder as 12.0.x-dev"
    - composer install
    # Run the Drush PHP script directly: vendor/bin/drush is a shell proxy.
    - export DRUSH="php -d memory_limit=-1 vendor/drush/drush/drush.php"
    # The Webship installer, with a site template chosen without the browser.
    - $DRUSH site:install webship -y
      installer_site_template_form.add_ons=webship_portal
      --db-url=mysql://$MYSQL_USER:$MYSQL_PASSWORD@database/$MYSQL_DATABASE
      --account-name=admin --account-pass=admin
    - $DRUSH status --fields=drupal-version,db-status
    - $DRUSH pm:list --status=enabled --format=list | grep -x webtheme
